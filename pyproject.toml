[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortheon"
version = "2.0.0"
description = "Unified consensus and mechanical verification runtime that elevates frozen local models to frontier performance with zero weight changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sympy>=1.13",
    "z3-solver>=4.13",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cortheon = "cortheon.cli:main"
flash-forge = "flash_forge.cli:main"

[tool.setuptools.packages.find]
include = ["cortheon*", "flash_forge*"]

[tool.setuptools.package-data]
flash_forge = ["_skill/*.md", "_skill/*.json", "_skill/cards/*.md", "_integrations/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
