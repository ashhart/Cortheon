[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortheon"
version = "2.3.0"
description = "Execution-verified parallel consensus, Live Web Cockpit, CodeForge v7 streaming, SpecVerify, polyglot proof-carrying diff guard (SARIF + hooks), self-play DPO flywheel, and MCP server for local models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sympy>=1.13",
    "z3-solver>=4.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Only the proxy and the Live Cockpit need the web stack; the CLI, the solvers,
# and the stdio MCP server import it lazily.
proxy = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["pytest>=8.0", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
cortheon = "cortheon.cli:main"
flash-forge = "flash_forge.cli:main"

[tool.setuptools.packages.find]
include = ["cortheon*", "flash_forge*"]

[tool.setuptools.package-data]
flash_forge = ["_skill/*.md", "_skill/*.json", "_skill/cards/*.md", "_integrations/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
