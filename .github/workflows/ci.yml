name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install quality tools
        run: python -m pip install --quiet -e '.[test]' ruff pyright
      - name: Install TypeScript parser
        run: npm install --global typescript@7.0.2
      - name: Lint
        run: ruff check build_backend.py build_support src tests
      - name: Check formatting
        run: ruff format --check build_backend.py build_support src tests
      - name: Type check
        run: pyright
      - name: Parse JavaScript and TypeScript adapters
        run: |
          find src/cortheon -name '*.js' -print0 | xargs -0 -n1 node --check
          find src/cortheon -name '*.ts' -print0 | xargs -0 tsc --noEmit --noCheck --allowImportingTsExtensions --module ESNext --moduleResolution Bundler --target ES2022

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test and build dependencies
        run: python -m pip install --quiet -e '.[test]' build
      - name: Run unit tests (offline)
        run: PYTHONPATH=src python -m pytest -q
      - name: Build source and wheel artifacts
        run: python -m build --sdist --wheel
      - name: Install wheel and check entry points
        run: |
          python -m pip install --quiet dist/*.whl
          cortheon --help > /dev/null
